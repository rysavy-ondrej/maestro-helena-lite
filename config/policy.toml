# The per-source confidence thresholds that decide when a match escalates
# independently of triage — policy, not constants in a branch.
#
# `concept/02-concepts-and-taxonomy.md`, the source tier table:
#
#   Tier A — "May establish `malicious` by itself if scope and freshness are
#            adequate. **Escalates independently of triage**"
#   Tier B — "Usually malicious when high confidence. **High-confidence B
#            escalates independently**"
#
# **High confidence** is the only part of that with a number in it, and the
# number is per source: a confidence of 0.75 does not mean the same thing coming
# from two feeds that compute it differently. So there is one entry per Tier B
# source and no default — `helena.policy.thresholds()` fails at startup naming a
# registered Tier B source this file is silent about, because a threshold nobody
# chose is the silent configuration default `concept/instruction.md` §6 lists by
# name, and it would be invisible in exactly the deployment where it mattered.
#
# Tier A takes no entry: `concept/02` conditions it on scope and freshness and
# not on a number, and a threshold here would be this file inventing one. Tiers C
# and D take none either — `concept/04-the-two-agents.md` gives independent
# escalation to A and high-confidence B and to nothing else, so a threshold for a
# C source would be a key nothing reads.
#
# ## The two versions, and why there are two
#
# `policy_version` says which frozen rule module these thresholds are the
# thresholds *for*. `helena.policy.v1.escalate` refuses a threshold set recording
# another one, the way `constrain` refuses a result recording another one: a
# number that was applied by rules it was not written for is a decision nobody
# made.
#
# `thresholds_version` is this file's own. It is recorded on every escalation,
# because `src/helena/policy/v1.py` is frozen and this file is not: an assessment
# that recorded only `policy_version` could not be replayed against the number
# that actually decided it. Move it whenever a threshold below moves.
#
# ## Where 0.80 came from, and what would change it
#
# Measured over the snapshot in `data/threatfox/` on 2026-09-09 — 4 095 entries,
# `confidence_level` divided by 100 by `sql/migrations/0014_feed_mapping_views.sql`:
#
# | | `>= 0.75` | `>= 0.80` | `= 1.00` |
# | --- | --- | --- | --- |
# | 3 375 `ip:port` | 3 184 (94.3 %) | 930 (27.6 %) | 918 (27.2 %) |
# | 433 `domain` | 234 (54.0 %) | 230 (53.1 %) | 180 (41.6 %) |
# | 287 `url` | 280 (97.6 %) | 217 (75.6 %) | 202 (70.4 %) |
#
# The distribution is bimodal and 0.75 carries two thirds of the address side on
# its own (2 254 of 3 375). A threshold at or below it admits 94 % of every
# ThreatFox hit, which makes the threshold decorative and puts the whole of the
# over-alerting risk on the traffic test. 0.80 is the first value above that
# mode: it admits 80, 90, 99 and 100 and excludes the bulk value.
#
# **It is a candidate, not a decision.** `concept/08-open-questions.md` lists
# "the per-source confidence thresholds that decide when a Tier B match escalates
# independently" as open and blocking, and what settles it is an escalation rate
# measured against labelled outcomes — which does not exist, for the reason
# nothing else in this repository is calibrated either. What is demonstrated is
# that the number is loaded from here, recorded on the decision it made, and
# changeable without touching a frozen rule.

policy_version = "v1"
thresholds_version = "2026-09-09"
# The send policy's own version, up here because TOML puts a bare key in the last
# table that was opened and every table below this line is somebody's. It is
# recorded on every disclosure; the section at the foot of this file is what it
# versions.
send_policy_version = "2026-09-09"

[thresholds]
# ThreatFox. Tier B in `concept/05-threat-intelligence.md`'s catalogue: "explicit
# provider verdict or high-quality curated listing without full direct evidence".
threatfox = 0.80

# --- Budgets ------------------------------------------------------------------
#
# The four dimensions enforced per agent run — policy, not constants in a branch,
# by the same sentence of `concept/07-principles.md` that says it of the
# thresholds above: "budget values are **policy, not constants in a branch**; the
# same applies to confidence thresholds." `helena.budgets.load()` reads these and
# `helena.budgets.RunBudget` is what spends them; there is no default in the code
# and no fallback if a value below is absent.
#
# ## Three dimensions are written here and the fourth is derived
#
# `concept/07` is emphatic that the wall clock and the live-query count are **not
# set independently**: "at a few lookups per minute, an analyst run checking six
# indicators spends over a minute waiting on the rate limit alone, before any
# inference." So `live_queries` is not a key. It is
#
#     floor(retrieval_seconds x slowest [rate_limits] entry / 60)
#
# and the loader refuses a pair that contradicts itself: a retrieval allowance
# that does not fit inside the wall clock, one that buys no query at the slowest
# configured rate, or a step budget too small to reach the live queries it was
# given.
#
# `[budgets.triage]` states neither `steps` nor `retrieval_seconds` and is given
# zero of both. `concept/04-the-two-agents.md` gives triage "no tools at all", and
# `helena.contracts.v1.AgentRequest` refuses a triage request that budgets a step;
# a key here that could be set to 1 would be a lookup nobody has to justify.
#
# ## Where these numbers came from, and what would change them
#
# **Candidates, not decisions** — the same standing this file's 0.80 and
# `config/agents.toml`'s 3 have, and for the same reason: nothing has run against
# a labelled corpus, and no live provider has been queried through the tool layer
# at all. What is demonstrated is that the values are loaded from here, enforced
# at the boundary rather than in a prompt, and changeable without touching code.
#
# `[budgets.triage]` — triage runs on every context, so its budget is the one that
# multiplies. 8 000 tokens is `config/rendering.toml`'s 25 000-character rendering
# (~6-7 k tokens by the character-count reasoning in
# `docs/decisions/0019-the-rendering-size-budget.md`) plus the prompt and a small
# answer, with the retries of `config/agents.toml` spending the same budget; the
# run ends on the budget rather than on the retry count when a model keeps failing
# the schema, which is the intended order. 30 s is a stream stage's patience for a
# hosted call, not a measurement of one.
#
# `[budgets.analyst]` — the selective stage, so a number that would be reckless
# per context is affordable here. 300 s wall clock of which at most 120 s may be
# spent waiting on providers: at the 4 queries/minute below that derives **8**
# live queries, which covers `concept/07`'s own worked example of six indicators
# (90 s at that rate) and leaves 180 s for inference. 12 steps is those 8 live
# queries plus room for cache hits and for a refused call, because every one of
# those is a step; the loader would refuse a step budget below the derived
# live-query count.
#
# What would change any of them: measured per-run token consumption, a measured
# provider latency distribution, and a published or measured provider rate limit.
# All three are the same missing thing — nothing has run end to end against a live
# provider yet.

[budgets.triage]
tokens = 8000
wall_clock_seconds = 30.0

[budgets.analyst]
steps = 12
tokens = 60000
wall_clock_seconds = 300.0
# How much of that wall clock may be spent waiting on providers. Half the run
# would leave inference on the same footing as retrieval; this is 40 %.
retrieval_seconds = 120.0

# The rate the **tool layer holds itself to**, per source, in queries per minute.
#
# `concept/05-threat-intelligence.md`: "fair-use terms bind both tiers, and rate
# limits are **policy the tool layer enforces**, not an afterthought." So this is
# a self-imposed ceiling and **not a measured provider limit** — abuse.ch
# publishes fair-use terms rather than a number this project has verified, and
# measuring one would mean deliberately exceeding it against a live service.
# `concept/07`'s "a few lookups per minute" is the shape 4 comes from.
#
# It must be lowered the moment a provider states less. An entry must name a
# registered source (`helena.enrichment.SOURCES`); a source needs one only if
# something queries it live, so a feed loader has none — its fetch floor is on its
# descriptor, and a rate limit here would be a key nothing reads.
#
# **Nothing paces calls to this rate yet.** It is read for the derivation above
# and no throttle exists; the live adapter is what has to sleep between calls, and
# the wall-clock budget is what catches it when it does — provider waits are on
# the same clock as the model calls.
[rate_limits]
threatfox = 4

# --- The send policy ----------------------------------------------------------
#
# What may be sent to which source. `concept/07-principles.md`, "Privacy and
# disclosure": *"Querying an external source discloses the indicator to that
# source. Two separate obligations follow: what may be sent to which source is
# **governed policy**, and what was disclosed is recorded on the assessment."*
# `helena.disclosure.send_policy` reads this half of the file and
# `helena.tools.ProviderTool` enforces it before any request leaves — refusing a
# call it cannot admit rather than sending a trimmed one.
#
# `concept/08-open-questions.md` lists "which sources are approved for
# analyst-time querying and **what may be sent to each**" as open. This is the
# shape the answer is written in; the entries below are the first answer.
#
# ## The three keys, and why each is required
#
# `disclosed_to` is the host a source's requests go to, and it is what the
# disclosure record names as disclosed-to. A **host and never a URL**:
# `concept/07` requires a credential travelling in a URL to be redacted before
# anything is logged or stored, and a policy file that holds no URL cannot leak
# one. The tool layer holds none either — `tests/test_tools.py` reads that off the
# module's own AST — so the host lives here and the adapter is what speaks to it.
#
# `entity_types` is a **permission**, not a capability. `helena.enrichment.SOURCES`
# already says what a source answers about ("a JA3 list has nothing to say about
# a domain") and that produces a different refusal. This says what this deployment
# is willing to tell that source it has seen. The loader refuses a permission
# wider than the capability, because a line permitting something the source cannot
# answer about is one nothing reads.
#
# `fields` is which fields of the outbound request may be populated, out of
# `helena.disclosure.SENDABLE_FIELDS` — which is exactly the field set of
# `helena.tools.ToolCall`, the object the adapter is handed. A call needing a
# field this list omits is refused; nothing is stripped and sent anyway.
#
# ## Why only threatfox has an entry
#
# An entry means a source may be **queried live**, which is the same condition
# `[rate_limits]` above states. `sslbl-ja3` is a feed the loader copies locally
# and never a query — a local join discloses nothing (`concept/03`) — so an entry
# for it would permit a disclosure nothing makes.
#
# ## Where `threatfox-api.abuse.ch` came from
#
# Measured, not read off a page: `POST https://threatfox-api.abuse.ch/api/v1/`
# with no `Auth-Key` header answered **401 `{"error": "Unauthorized"}`** on
# 2026-09-09, which is the same result `src/helena/enrichment.py` records from
# 2026-09-06, and the bulk export the loader uses is a different host
# (`threatfox.abuse.ch`) that needs no credential at all. The probe sent no
# credential and no indicator. **The query surface behind that host is still
# unconfirmed** — no per-indicator endpoint appears in the public documentation,
# and confirming it is the first-live-provider increment's job. What is settled
# here is where an analyst-tier query would go, which is what a disclosure record
# has to name.
[send_policy.threatfox]
disclosed_to = "threatfox-api.abuse.ch"
# All three types the source covers. ThreatFox's tier-B claims are about
# addresses, names and URLs, and an analyst that may ask about an address but not
# the name it resolved from would be reasoning across a gap this file created.
entity_types = ["address", "domain", "url"]
# The indicator, and nothing else. The tenant, the sensor, the monitored host and
# the window are things this layer knows and never sends: `concept/07` says an
# analyst lookup discloses "the indicators the case suggests", and everything
# else about the case is the deployment's own.
fields = ["entity_type", "entity_value"]
